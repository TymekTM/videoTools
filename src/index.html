<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;0,900;1,400&family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;600;700;900&family=Lora:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Merriweather:wght@400;700;900&family=Outfit:wght@400;500;600;700;800&family=Oswald:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Roboto+Slab:wght@400;700&family=Sora:wght@400;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Grotesk:wght@400;600;700&family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="tool-nav">
      <div class="tool-nav-logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="1" y="1" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <polygon points="8,6 14,10 8,14" fill="currentColor"/>
        </svg>
      </div>
      <div class="tool-nav-items">
        <button class="tool-nav-btn active" data-tool="newspaper" title="News Mockup">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16v16H4z"/>
            <path d="M4 9h16"/>
            <path d="M4 14h10"/>
            <path d="M4 17h7"/>
          </svg>
        </button>
        <button class="tool-nav-btn" data-tool="chat" title="Fake Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </button>
      </div>
      <div class="tool-nav-bottom">
        <div class="tool-nav-res" id="globalResInfo">1920x1080</div>
      </div>
    </nav>

    <!-- TOOL: Newspaper -->
    <div class="tool-panel active" data-tool="newspaper">
      <section class="preview-area">
        <div class="preview-wrapper" id="previewWrapper">
          <div class="preview-canvas" id="previewCanvas"></div>
          <div class="preview-vignette" id="vignette"></div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">News Mockup</span>
          <span class="slide-counter" id="slideCounter">— / —</span>
        </div>

        <div class="control-group">
          <label class="control-label">Słowo kluczowe</label>
          <input type="text" class="control-input" id="keywordInput" value="SZTUKA" placeholder="Wpisz słowo...">
        </div>

        <div class="control-group">
          <label class="control-label">Prędkość <span class="control-value" id="speedValue">0.8s</span></label>
          <input type="range" class="control-range" id="speedRange" min="100" max="1000" step="50" value="800" data-default="800">
        </div>

        <div class="control-group">
          <label class="control-label">Highlight</label>
          <div class="custom-highlight-row">
            <input type="color" class="control-color" id="colorAccent" value="#facc15">
            <div class="custom-highlight-preview" id="accentPreview">SZTUKA</div>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Format</label>
          <div class="control-btn-group" id="formatGroup">
            <button class="control-btn active" data-format="16:9">16:9</button>
            <button class="control-btn" data-format="9:16">9:16</button>
            <button class="control-btn" data-format="1:1">1:1</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Rozdzielczość</label>
          <select class="control-select" id="resolutionSelect">
            <option value="720p">720p</option>
            <option value="1080p" selected>1080p</option>
            <option value="4K">4K</option>
          </select>
        </div>

        <div class="custom-section collapsed">
          <div class="custom-header" id="customToggle">
            <span class="custom-header-arrow">&#9660;</span>
            <span>Customizacja</span>
          </div>
          <div class="custom-body" id="customBody">
            <div class="custom-group">
              <label class="custom-label">Nagłówek</label>
              <input type="text" class="control-input" id="customHeadline" placeholder="Losowy lorem ipsum">
            </div>
            <div class="custom-group">
              <label class="custom-label">Lead (1. akapit)</label>
              <textarea class="control-textarea" id="customLead" rows="2" placeholder="Losowy lorem ipsum"></textarea>
            </div>
            <div class="custom-group">
              <label class="custom-label">Zoom <span class="control-value" id="zoomVal">1.8x</span></label>
              <input type="range" class="control-range" id="zoomRange" min="1" max="3" step="0.1" value="1.8" data-default="1.8">
            </div>
            <div class="custom-group">
              <label class="custom-label">Offset X <span class="control-value" id="offXVal">0</span></label>
              <input type="range" class="control-range" id="offXRange" min="-300" max="300" step="5" value="0" data-default="0">
            </div>
            <div class="custom-group">
              <label class="custom-label">Offset Y <span class="control-value" id="offYVal">0</span></label>
              <input type="range" class="control-range" id="offYRange" min="-300" max="300" step="5" value="0" data-default="0">
            </div>
            <div class="custom-group">
              <label class="custom-label">Skala czcionki <span class="control-value" id="fontScaleVal">100%</span></label>
              <input type="range" class="control-range" id="fontScaleRange" min="80" max="140" step="5" value="100" data-default="100">
            </div>
            <div class="custom-group">
              <label class="custom-label">Line-height <span class="control-value" id="lineHVal">1.72</span></label>
              <input type="range" class="control-range" id="lineHRange" min="1.0" max="2.5" step="0.05" value="1.72" data-default="1.72">
            </div>
            <div class="custom-group">
              <label class="custom-label">Winieta moc <span class="control-value" id="vignetteVal">70%</span></label>
              <input type="range" class="control-range" id="vignetteRange" min="0" max="100" step="5" value="70" data-default="70">
            </div>
            <div class="custom-group">
              <label class="custom-label">Winieta rozmiar <span class="control-value" id="vignetteSizeVal">60%</span></label>
              <input type="range" class="control-range" id="vignetteSizeRange" min="20" max="80" step="5" value="60" data-default="60">
            </div>
            <div class="custom-group">
              <label class="custom-label">Winieta rozmycie <span class="control-value" id="vignetteSpreadVal">70%</span></label>
              <input type="range" class="control-range" id="vignetteSpreadRange" min="10" max="80" step="5" value="70" data-default="70">
            </div>
            <div class="custom-group">
              <label class="custom-label">Przejście <span class="control-value" id="transitionVal">120ms</span></label>
              <input type="range" class="control-range" id="transitionRange" min="0" max="500" step="10" value="120" data-default="120">
            </div>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Szablony stron</label>
          <div class="template-toggles" id="templateToggles"></div>
        </div>

        <div class="control-actions">
          <button class="btn btn-primary" id="btnPlay">
            <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="2,0 14,7 2,14" fill="currentColor"/></svg>
            <span>Play</span>
          </button>
          <button class="btn btn-secondary" id="btnStop">
            <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="2" fill="currentColor"/></svg>
            <span>Stop</span>
          </button>
          <button class="btn btn-ghost" id="btnShuffle">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 10h2l3-6h2l3 6h2"/>
              <path d="M1 4h2l3 6h2l3-6h2"/>
            </svg>
            <span>Losuj</span>
          </button>
        </div>

        <div class="control-actions">
          <button class="btn btn-primary" id="btnExportMp4" style="flex:1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <span>Eksportuj MP4</span>
          </button>
          <div class="custom-group" style="flex:none;width:80px">
            <label class="custom-label" style="font-size:10px">Czas (s)</label>
            <input type="number" class="control-input" id="exportDuration" value="30" min="5" max="600" style="padding:4px 6px;text-align:center">
          </div>
        </div>

        <div class="chat-export-progress" id="newsExportProgress" style="display:none">
          <div class="chat-export-bar"><div class="chat-export-bar-fill" id="newsExportBarFill"></div></div>
          <span class="chat-export-label" id="newsExportLabel">...</span>
        </div>

        <div class="control-group" style="margin-top:auto">
          <div class="resolution-info" id="resolutionInfo">1920 × 1080</div>
        </div>
      </aside>
    </div>

    <!-- TOOL: Fake Chat -->
    <div class="tool-panel" data-tool="chat">
      <section class="preview-area" id="chatPreviewArea">
        <div class="preview-wrapper" id="chatPreviewWrapper">
          <div class="preview-canvas" id="chatPreviewCanvas"></div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Fake Chat</span>
        </div>

        <div class="control-group">
          <label class="control-label">Platforma</label>
          <div class="control-btn-group chat-platform-grid" id="chatPlatformGroup">
            <button class="control-btn active" data-platform="imessage">iMessage</button>
            <button class="control-btn" data-platform="whatsapp">WhatsApp</button>
            <button class="control-btn" data-platform="discord">Discord</button>
            <button class="control-btn" data-platform="messenger">Messenger</button>
            <button class="control-btn" data-platform="custom">Custom</button>
          </div>
        </div>

        <div class="chat-custom-theme" id="chatCustomTheme" style="display:none">
          <div class="custom-group">
            <label class="custom-label">Tło czatu</label>
            <input type="color" class="control-color" id="chatCustomBg" value="#1a1a2e">
          </div>
          <div class="custom-group">
            <label class="custom-label">Tło nagłówka</label>
            <input type="color" class="control-color" id="chatCustomHeaderBg" value="#16213e">
          </div>
          <div class="custom-row">
            <div class="custom-color">
              <label class="custom-label">Dymek L</label>
              <input type="color" class="control-color" id="chatCustomBubbleL" value="#2a2a4a">
            </div>
            <div class="custom-color">
              <label class="custom-label">Dymek P</label>
              <input type="color" class="control-color" id="chatCustomBubbleR" value="#6366f1">
            </div>
          </div>
          <div class="custom-group">
            <label class="custom-label">Kolor tekstu</label>
            <input type="color" class="control-color" id="chatCustomText" value="#e4e4e7">
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Format</label>
          <div class="control-btn-group" id="chatFormatGroup">
            <button class="control-btn active" data-format="16:9">16:9</button>
            <button class="control-btn" data-format="9:16">9:16</button>
            <button class="control-btn" data-format="1:1">1:1</button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Rozdzielczość</label>
          <select class="control-select" id="chatResolutionSelect">
            <option value="720p">720p</option>
            <option value="1080p" selected>1080p</option>
            <option value="4K">4K</option>
          </select>
        </div>

        <div class="chat-contacts">
          <label class="control-label">Osoby</label>
          <div class="chat-contact-row">
            <div class="chat-contact-item">
              <div class="chat-avatar-upload" id="chatAvatar1Wrap" title="Upload avatar">
                <img class="chat-avatar-preview" id="chatAvatar1Img" src="" style="display:none">
                <span class="chat-avatar-initial" id="chatAvatar1Initial">J</span>
                <input type="file" class="chat-avatar-file" id="chatAvatar1File" accept="image/*">
              </div>
              <input type="text" class="control-input chat-contact-input" id="chatContact1Name" value="Jan" placeholder="Imię">
              <input type="color" class="control-color chat-contact-color" id="chatContact1Color" value="#007AFF">
            </div>
          </div>
          <div class="chat-contact-row">
            <div class="chat-contact-item">
              <div class="chat-avatar-upload" id="chatAvatar2Wrap" title="Upload avatar">
                <img class="chat-avatar-preview" id="chatAvatar2Img" src="" style="display:none">
                <span class="chat-avatar-initial" id="chatAvatar2Initial">A</span>
                <input type="file" class="chat-avatar-file" id="chatAvatar2File" accept="image/*">
              </div>
              <input type="text" class="control-input chat-contact-input" id="chatContact2Name" value="Anna" placeholder="Imię">
              <input type="color" class="control-color chat-contact-color" id="chatContact2Color" value="#34C759">
            </div>
          </div>
        </div>

        <div class="chat-anim-controls">
          <label class="control-label">Animacja</label>
          <div class="control-btn-group" id="chatAnimSpeedGroup">
            <button class="control-btn" data-speed="0">Wył.</button>
            <button class="control-btn active" data-speed="600">Szybka</button>
            <button class="control-btn" data-speed="1200">Normal</button>
            <button class="control-btn" data-speed="2200">Wolna</button>
          </div>
          <label class="control-checkbox"><input type="checkbox" id="chatHideTime"> Ukryj godzinę</label>
        </div>

        <div class="control-group">
          <label class="control-label">Wiadomości</label>
          <div class="chat-messages-list" id="chatMessagesList"></div>
        </div>

        <div class="chat-add-message">
          <select class="control-select chat-add-sender" id="chatAddSender">
            <option value="0">Jan</option>
            <option value="1">Anna</option>
          </select>
          <input type="text" class="control-input chat-add-text" id="chatAddText" placeholder="Wpisz wiadomość...">
          <button class="btn btn-primary chat-add-btn" id="chatAddBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg>
          </button>
        </div>

        <div class="chat-export-progress" id="chatExportProgress">
          <div class="chat-export-bar"><div class="chat-export-bar-fill" id="chatExportBarFill"></div></div>
          <span class="chat-export-label" id="chatExportLabel">...</span>
        </div>

        <div class="control-actions" style="margin-top:auto">
          <button class="btn btn-ghost" id="chatClearBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h10M5 4V2.5A.5.5 0 015.5 2h3a.5.5 0 01.5.5V4M11 4v7.5a1.5 1.5 0 01-1.5 1.5h-5A1.5 1.5 0 013 11.5V4"/></svg>
            <span>Wyczyść</span>
          </button>
          <button class="btn btn-secondary" id="chatPreviewAnimBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3,1 12,7 3,13" fill="currentColor"/></svg>
            <span>Podgląd</span>
          </button>
          <button class="btn btn-primary" id="chatExportBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 10v2a1 1 0 001 1h8a1 1 0 001-1v-2M7 2v8M4 5l3-3 3 3"/></svg>
            <span>PNG</span>
          </button>
          <button class="btn btn-secondary" id="chatExportMp4Btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <span>MP4</span>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
